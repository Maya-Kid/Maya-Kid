<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <title>Maya Kid — Applied AI and open source</title>
  <desc>A dark navy profile banner for Maya Kid. Building reliable AI systems, with a focus on agents, retrieval, evaluation, and multimodal systems. A mint line drawing connects sources, reasoning, and action.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#A2D2CE" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2631"/>
      <stop offset="1" stop-color="#081923"/>
    </linearGradient>
    <linearGradient id="connection" x1="769" y1="164" x2="1086" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50757C"/>
      <stop offset=".6" stop-color="#91E7CC"/>
      <stop offset="1" stop-color="#D4E9A6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" stroke="#44616C" stroke-opacity=".45"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="url(#grid)"/>

  <!-- Editorial title block. -->
  <path d="M64 66H88" stroke="#A0EDD0" stroke-width="3"/>
  <text x="102" y="72" fill="#A0EDD0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.5">APPLIED AI · OPEN SOURCE</text>
  <text x="60" y="171" fill="#F2F6ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-3.8">Maya Kid<tspan fill="#E9CE7F">.</tspan></text>
  <text x="64" y="221" fill="#C0D2D5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="29" letter-spacing="-.45">Building reliable AI systems.</text>
  <text x="65" y="270" fill="#7E9AA5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.25">THOUGHTFUL TOOLS. PRACTICAL IMPACT.</text>

  <!-- A compact system sketch: evidence is connected, evaluated, and acted on. -->
  <g stroke="#537880" stroke-opacity=".25">
    <circle cx="921" cy="175" r="121"/>
    <circle cx="921" cy="175" r="100" stroke-dasharray="3 9"/>
    <path d="M921 41V54M921 296V309M787 175H800M1042 175H1055"/>
  </g>
  <path d="M781 121H819C843 121 843 175 866 175M781 229H819C843 229 843 175 866 175M976 175H1051" stroke="url(#connection)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1039 168L1046 175L1039 182" stroke="#A0EDD0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="725" y="93" width="56" height="56" rx="14" fill="#102F3A" stroke="#486E77"/>
  <path d="M741 111H765M741 121H758M741 131H762" stroke="#A4BEC3" stroke-width="2" stroke-linecap="round"/>
  <rect x="725" y="201" width="56" height="56" rx="14" fill="#102F3A" stroke="#486E77"/>
  <path d="M740 237L748 223L758 231L767 216" stroke="#A4BEC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="740" cy="237" r="2.5" fill="#A4BEC3"/>
  <circle cx="767" cy="216" r="2.5" fill="#A4BEC3"/>

  <rect x="866" y="120" width="110" height="110" rx="28" fill="#143D45" stroke="#A0EDD0" stroke-width="1.5"/>
  <rect x="874" y="128" width="94" height="94" rx="22" stroke="#A0EDD0" stroke-opacity=".12"/>
  <!-- The interlocking paths suggest synthesis rather than a stock AI icon. -->
  <path d="M899 176L921 154L943 176L921 198L899 176Z" stroke="#BDF4DE" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M899 162L921 184L943 162M899 190L921 168L943 190" stroke="#BDF4DE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="921" cy="175" r="4" fill="#E9CE7F"/>

  <rect x="1051" y="147" width="56" height="56" rx="14" fill="#173A3D" stroke="#A0EDD0"/>
  <path d="M1067 175L1075 183L1092 166" stroke="#C4EFCC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1002" cy="82" r="4" fill="#E9CE7F"/>
  <circle cx="840" cy="265" r="3" fill="#A0EDD0" fill-opacity=".7"/>
  <text x="921" y="270" text-anchor="middle" fill="#A0B7BE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">CONNECT → REASON → ACT</text>

  <path d="M64 320H1136" stroke="#38525F"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#C7DADC">
    <circle cx="69" cy="368" r="4" fill="#A0EDD0"/>
    <text x="86" y="375">Agents</text>
    <path d="M197 356V380" stroke="#38525F"/>
    <text x="228" y="375">Retrieval</text>
    <path d="M351 356V380" stroke="#38525F"/>
    <text x="382" y="375">Evaluation</text>
    <path d="M526 356V380" stroke="#38525F"/>
    <text x="557" y="375">Multimodal</text>
  </g>
  <text x="1136" y="374" text-anchor="end" fill="#7E9AA5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">MAYA-KID / GITHUB</text>
</svg>
